<!doctype html><meta charset="utf-8"><title>Grim responsive QA</title><style>body{background:#111;color:#eee;font:14px monospace}button,select{margin:8px;padding:8px}#frame{border:0;transform-origin:top left}pre{white-space:pre-wrap;position:fixed;right:0;top:55px;max-height:220px;overflow:auto;background:#111c;font-size:10px;width:170px;z-index:3}</style><label>Viewport <select id="size"><option>1536x960</option><option>1366x768</option><option>1024x768</option><option>390x844</option></select></label><label>Page <select id="page"><option value="../index.html">Stage</option><option value="../dm.html">DM</option><option value="../index.html?webgl=0">Fallback</option></select></label><pre id="report"></pre><iframe id="frame" title="Grim test viewport" src="../index.html"></iframe><script>
const f=document.querySelector('#frame'),size=document.querySelector('#size'),page=document.querySelector('#page');function resize(){const [w,h]=size.value.split('x').map(Number);f.style.width=w+'px';f.style.height=h+'px';f.style.transform=`scale(${Math.min(1,1200/w)})`;}size.onchange=resize;page.onchange=()=>f.src=page.value;resize();setInterval(()=>{const d=f.contentDocument,w=f.contentWindow;if(!d)return;const cards=[...d.querySelectorAll('.card-position')].map(e=>({id:e.dataset.combatantId,rank:+e.dataset.turnRank,faction:e.dataset.faction,r:e.getBoundingClientRect()})),overlaps=[];for(let i=0;i<cards.length;i++)for(let j=i+1;j<cards.length;j++){let a=cards[i].r,b=cards[j].r;if(a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top)overlaps.push([cards[i].id,cards[j].id]);}document.querySelector('#report').textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],document:[d.documentElement.scrollWidth,d.documentElement.scrollHeight],cards:cards.length,overlaps,outside:cards.filter(c=>c.r.left<0||c.r.right>w.innerWidth||c.r.top<0||c.r.bottom>w.innerHeight).map(c=>c.id),world:d.querySelector('#worldStatus')?.textContent,stats:w.grim3DStats,order:cards.map(c=>({rank:c.rank,faction:c.faction,x:Math.round(c.r.x),y:Math.round(c.r.y)}))},null,2);},700);
</script>
