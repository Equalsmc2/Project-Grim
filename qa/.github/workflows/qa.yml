name: Project QA
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      generate_baselines:
        description: Generate candidate Linux screenshots for review (does not commit them)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: qa
    env:
      CI: 'true'
      QA_VISUAL: ${{ vars.QA_VISUAL || 'capture' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:unit
      - name: Run tests
        if: ${{ !inputs.generate_baselines }}
        run: npm test
      - name: Generate candidate baselines
        if: ${{ inputs.generate_baselines }}
        env:
          QA_VISUAL: compare
        run: npm run baseline
      - name: Save reports even when tests fail
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ github.run_id }}
          path: |
            qa/artifacts/
            qa/tests/baselines/
          retention-days: 14
          if-no-files-found: warn
