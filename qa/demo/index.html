<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project QA Demo</title>
<link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef4ff;font:18px system-ui}main,header{max-width:900px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:24px;flex-wrap:wrap}h1{font-size:clamp(2rem,7vw,4rem);line-height:1.1}p{color:#bed0e8}button,input,textarea{font:inherit;border-radius:8px;padding:12px;border:1px solid #6c83a2}button{background:#9ce8d2;color:#101827;cursor:pointer}a{color:#9ce8d2}label{display:grid;gap:8px;margin:20px 0}input,textarea{width:100%;background:#1c293c;color:white}section{padding:24px 0}form{max-width:520px}:focus-visible{outline:3px solid #ffce70;outline-offset:4px}
</style></head><body><header><button aria-expanded="false" aria-controls="menu">Menu</button><nav id="menu" hidden><a href="#contact">Contact</a></nav></header><main><h1>Small checks.<br>Clear evidence.</h1><p>A portable testing demo for desktop and mobile browsers.</p><section id="contact"><h2>Contact</h2><form><label>Email<input type="email" required></label><label>Message<textarea required></textarea></label><button>Send message</button><p role="status"></p></form></section></main><script>
const toggle=document.querySelector('header button'),menu=document.querySelector('nav');toggle.onclick=()=>{menu.hidden=!menu.hidden;toggle.setAttribute('aria-expanded',String(!menu.hidden))};document.querySelector('form').onsubmit=e=>{e.preventDefault();document.querySelector('[role=status]').textContent='Message received.'};
</script></body></html>
