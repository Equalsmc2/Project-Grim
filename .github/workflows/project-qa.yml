name: Project QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Unit and regression suites (v2 + preserved 1.5.8)
        run: node tools/run-tests.mjs
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with: { name: unit-${{ github.run_id }}, path: qa-reports/, retention-days: 14, if-no-files-found: warn }

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        rules: [current, deployed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Test-only dependencies (not part of the website)
        run: npm install --no-save --no-package-lock playwright@1.56.1 firebase@10.14.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Page checks (layout, card visibility, tactical round trip)
        if: ${{ matrix.rules == 'current' }}
        env: { BROWSER: '${{ matrix.browser }}' }
        run: node tests/v2/e2e/ui.e2e.mjs
      - name: Multi-client sync against the Firebase emulator
        env: { BROWSER: '${{ matrix.browser }}', RULES: '${{ matrix.rules }}', FIREBASE_SDK_DIR: node_modules/firebase }
        run: node tests/v2/e2e/sync.e2e.mjs
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with: { name: browser-${{ matrix.browser }}-${{ matrix.rules }}-${{ github.run_id }}, path: qa-reports/, retention-days: 14, if-no-files-found: warn }
